name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # to attach Setup.exe to releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests (core engines with real FFmpeg and PDFium)
        shell: pwsh
        run: |
          ./installer/Install-ShiftDrop.ps1 -SkipBuild -NoLaunch -ToolsOnly
          $env:SHIFTDROP_FFMPEG_DIR = "$PWD/build/publish/tools"
          $env:SHIFTDROP_PDFIUM_DIR = "$PWD/build/publish/tools"
          dotnet run --project tests/ShiftDrop.Tests -c Release

      - name: Publish
        shell: pwsh
        run: ./installer/Install-ShiftDrop.ps1 -NoLaunch -NoInstall

      - name: Zip
        shell: pwsh
        run: |
          $v = (Get-Item build/publish/ShiftDrop.exe).VersionInfo.ProductVersion.Split('+')[0]
          Compress-Archive -Path build/publish/* -DestinationPath "build/ShiftDrop-$v-win-x64.zip"

      - name: Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Arabic.isl needs Inno Setup 6.5 or newer; this installs or upgrades it
          choco upgrade innosetup -y --no-progress | Out-Host
          $v = (Get-Item build/publish/ShiftDrop.exe).VersionInfo.ProductVersion.Split('+')[0]
          & $iscc "/DAppVersion=$v" installer/ShiftDrop.iss
          if (-not (Test-Path "build/ShiftDrop-Setup-$v.exe")) { throw 'Setup.exe was not produced' }

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftDrop-win-x64
          path: |
            build/ShiftDrop-*-win-x64.zip
            build/ShiftDrop-Setup-*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ShiftDrop-*-win-x64.zip
            build/ShiftDrop-Setup-*.exe
