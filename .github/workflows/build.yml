name: build

on:
  push:
    branches: [main, 'wip/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # to attach Setup.exe to releases

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests (core engines with real FFmpeg and PDFium)
        shell: pwsh
        run: |
          ./installer/Install-ShiftDrop.ps1 -SkipBuild -NoLaunch -ToolsOnly
          $env:SHIFTDROP_FFMPEG_DIR = "$PWD/build/publish/tools"
          $env:SHIFTDROP_PDFIUM_DIR = "$PWD/build/publish/tools"
          $env:SHIFTDROP_ONNX_DIR = "$PWD/build/publish/tools"
          dotnet run --project tests/ShiftDrop.Tests -c Release

      - name: Publish
        shell: pwsh
        run: ./installer/Install-ShiftDrop.ps1 -NoLaunch -NoInstall

      - name: Design previews
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath build/publish/ShiftDrop.exe -ArgumentList '--preview', "$PWD/build/preview"
          Get-ChildItem build/preview | Format-Table Name, Length | Out-Host
          Get-ChildItem build/preview -Filter *.txt | ForEach-Object { Write-Host "::notice title=preview $($_.Name)::$((Get-Content $_.FullName -Raw).Substring(0, [Math]::Min(600, (Get-Content $_.FullName -Raw).Length)))" }

      # the PNGs land on the ci-previews branch so they can be looked at without downloading artifacts
      - name: Publish previews
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build/preview/samples -ErrorAction SilentlyContinue
          Set-Location build/preview
          git init -q
          git checkout -q -b ci-previews
          git add -A
          git -c user.name="ShiftDrop CI" -c user.email="ci@users.noreply.github.com" commit -qm "Design previews for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-previews

      - name: Zip
        shell: pwsh
        run: |
          $v = (Get-Item build/publish/ShiftDrop.exe).VersionInfo.ProductVersion.Split('+')[0]
          Compress-Archive -Path build/publish/* -DestinationPath "build/ShiftDrop-$v-win-x64.zip"

      - name: Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Arabic.isl needs Inno Setup 6.5 or newer; this installs or upgrades it
          choco upgrade innosetup -y --no-progress | Out-Host
          $v = (Get-Item build/publish/ShiftDrop.exe).VersionInfo.ProductVersion.Split('+')[0]
          & $iscc "/DAppVersion=$v" installer/ShiftDrop.iss
          if (-not (Test-Path "build/ShiftDrop-Setup-$v.exe")) { throw 'Setup.exe was not produced' }

      - name: Store package (MSIX)
        shell: pwsh
        run: ./installer/Build-Msix.ps1

      # A push to main with a version number that has no release yet publishes one.
      # (Bump <Version> in Directory.Build.props to release.)
      - name: Is this a new version?
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Item build/publish/ShiftDrop.exe).VersionInfo.ProductVersion.Split('+')[0]
          gh release view "v$v" --repo "${{ github.repository }}" 2>$null | Out-Null
          $new = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
          "v=$v" >> $env:GITHUB_OUTPUT
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "version $v, new release: $new"
          $global:LASTEXITCODE = 0   # "release not found" is the expected answer for a new version

      # Code signing: free for open source from SignPath Foundation. It switches on by itself once the
      # SIGNPATH_ORGANIZATION_ID variable and the SIGNPATH_API_TOKEN secret exist (repo Settings > Secrets and variables).
      # Only new releases are signed; each request waits for the approver to accept it on signpath.io.
      - name: Upload the unsigned installer for signing
        id: unsigned
        if: steps.version.outputs.new == 'true' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: build/ShiftDrop-Setup-*.exe

      - name: Sign (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ShiftDrop' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/signed

      - name: Use the signed installer
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          Get-ChildItem build/signed -Recurse -Filter 'ShiftDrop-Setup-*.exe' | Copy-Item -Destination build -Force
          $setup = Get-ChildItem build/ShiftDrop-Setup-*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $setup.FullName
          Write-Host "signature: $($sig.Status) · $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw 'The installer came back unsigned' }

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftDrop-win-x64
          path: |
            build/ShiftDrop-*-win-x64.zip
            build/ShiftDrop-Setup-*.exe

      # for Partner Center: download from the run's artifacts and upload to the Store
      - uses: actions/upload-artifact@v4
        with:
          name: ShiftDrop-Store-msix
          path: build/ShiftDrop-*.msix

      - name: Release notes
        if: steps.version.outputs.new == 'true' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Item build/publish/ShiftDrop.exe).VersionInfo.ProductVersion.Split('+')[0]
          $log = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\s*\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { '' }
          $body = @(
            "**Download ``ShiftDrop-Setup-$v.exe``**, run it, then drag any file in File Explorer and press Shift."
            'Per-user install, no admin rights, works offline. Installed copies update themselves.'
            ''
            "**نزّل ملف ``ShiftDrop-Setup-$v.exe``** وشغّله، ثم اسحب أي ملف في المستكشف واضغط Shift."
            ''
            "## What's new"
            ''
            $notes
            ''
            'ShiftDrop is free. If it helps you, you can [support the developer](https://www.paypal.com/donate/?hosted_button_id=ZNRBHF6SX8ZH6) ♥'
            ''
            '[Code signing policy](https://github.com/baraadb/ShiftDrop#code-signing-policy) · [Privacy](https://github.com/baraadb/ShiftDrop/blob/main/PRIVACY.md)'
          ) -join "`n"
          Set-Content -Path build/notes.md -Value $body -Encoding UTF8

      - name: Release
        if: steps.version.outputs.new == 'true' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.v && format('v{0}', steps.version.outputs.v) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ShiftDrop ${{ steps.version.outputs.v || github.ref_name }}
          make_latest: true
          body_path: build/notes.md
          files: |
            build/ShiftDrop-*-win-x64.zip
            build/ShiftDrop-Setup-*.exe
